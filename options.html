<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ntfy Notifier Settings</title>
  </head>
  <body>
    <h1>Ntfy Configuration</h1>
    <label for="ntfyServer">Ntfy server:</label>
    <input type="url" id="ntfyServer" placeholder="https://ntfy.sh" style="width: 300px;"><br><br>
    <label for="ntfyTopic">Your ntfy topic:</label>
    <input type="text" id="ntfyTopic" placeholder="e.g., my_secret_channel" style="width: 300px;"><br><br>
    <label for="ntfyUsername">Username (optional):</label>
    <input type="text" id="ntfyUsername" placeholder="your-username" style="width: 300px;"><br><br>
    <label for="ntfyPassword">Password (optional):</label>
    <input type="password" id="ntfyPassword" placeholder="your-password" style="width: 300px;"><br><br>
    <button id="saveButton">Save Settings</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
